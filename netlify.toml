[build]
  # assets-src/ holds the full-resolution originals. They are only inputs to
  # `npm run images`, which is run locally and its outputs committed - so drop
  # them from the deploy, otherwise publish = "." would upload and publicly
  # serve ~12MB of source photos. tests/ goes for the same reason: the test
  # suite and its copy of the web fonts have no business being public pages.
  # This only touches Netlify's build clone.
  command = "npm run build && rm -rf assets-src tests"
  publish = "."
  # No serverless functions are in use. If you add some later, restore:
  #   functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "20"

# The brochures used to be served noindex, because the batch edit that branded
# them had left "THE VISIONARY" in a hidden text layer in all fifteen derived
# files - invisible on the page, but readable by a search engine. The
# re-rendered set is clean: each PDF now contains only its own name. So they are
# indexable again, and the header is gone.
