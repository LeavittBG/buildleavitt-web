[build]
  # publish = "." uploads the whole repository, so anything that is not part
  # of the site is deleted from Netlify's build clone once the stylesheet is
  # built, or it would be served publicly:
  #   assets-src/  ~12MB of full-resolution source photos
  #   tests/       the test suite and its copy of the web fonts
  #   src/ scripts/ package*.json tailwind.config.js
  #                build inputs, spent once dist/styles.css exists
  #   README.md CLAUDE.md
  #                notes for whoever works on the site
  # markup.test.js checks this list. This only touches the build clone.
  command = "npm run build && rm -rf assets-src tests src scripts package.json package-lock.json tailwind.config.js README.md CLAUDE.md HANDOFF.md"
  publish = "."
  # No serverless functions are in use. If you add some later, restore:
  #   functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "20"

# Pretty URLs off. With it on, Netlify rewrote every link as it published -
# /plans/the-poet.html became /plans/the-poet - while each page's canonical tag,
# the sitemap, the link-preview tags and the breadcrumb data all still named the
# .html address. Both addresses loaded, so search engines were told two
# different things about which one was real. Off, the site publishes exactly
# what is in this repository, which is also exactly what the test suite checks.
# Set here rather than in the Netlify dashboard so it cannot quietly change.
[build.processing.html]
  pretty_urls = false

# The brochures used to be served noindex, because the batch edit that branded
# them had left "THE VISIONARY" in a hidden text layer in all fifteen derived
# files - invisible on the page, but readable by a search engine. The
# re-rendered set is clean: each PDF now contains only its own name. So they are
# indexable again, and the header is gone.

# Response headers (November 2026). Netlify's default for everything else stays:
# "public, max-age=0, must-revalidate" with an ETag, which the HTML and
# dist/styles.css need because neither is content-hashed, so a change has to
# show at once. The plan renderings, brochures and the video are large and
# change rarely, so a returning visitor may keep them for a week. Not longer,
# and never `immutable`: a changed file keeps its name here (hero-home.jpg was
# replaced in place in October 2026, the brochures with every redraw).
# tests/seo.test.js checks these blocks.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/plans/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/plans/pdf/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
