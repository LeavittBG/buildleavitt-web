[build]
  # assets-src/ holds the full-resolution originals. They are only inputs to
  # `npm run images`, which is run locally and its outputs committed - so drop
  # them from the deploy, otherwise publish = "." would upload and publicly
  # serve ~12MB of source photos. This only touches Netlify's build clone.
  command = "npm run build && rm -rf assets-src"
  publish = "."
  # No serverless functions are in use. If you add some later, restore:
  #   functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "20"

# The plan brochures carry invisible leftover text. Fifteen of the sixteen were
# produced by batch-editing the branding onto copies of The Visionary, and each
# one still contains the words "THE VISIONARY" five times in a hidden layer -
# it does not render, but it is in the text of the file, and search engines read
# PDF text. Keeping them out of the index stops "The Poet" being indexed as
# though it were The Visionary. Nothing is lost by this: /plans/<model>.html is
# the better search result anyway, since it has the drawings, the specs and a
# way to get in touch, and those pages stay fully indexable.
#
# Remove this block once the brochures are re-exported without the hidden layer.
[[headers]]
  for = "/plans/pdf/*"
  [headers.values]
    X-Robots-Tag = "noindex"
